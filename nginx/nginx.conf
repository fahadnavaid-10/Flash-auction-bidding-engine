events {
    worker_connections 4096;
}

http {
    upstream gateway_cluster {
        # Round-robin distribution across our 3 FastAPI gateway instances
        server gateway-1:8000;
        server gateway-2:8000;
        server gateway-3:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # REST endpoints proxying
        location / {
            proxy_pass http://gateway_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # WebSocket endpoints with upgrade headers
        location /ws {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Disable buffering for low-latency auction fanout
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
